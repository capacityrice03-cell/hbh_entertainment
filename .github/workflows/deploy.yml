name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天台灣時間上午 11 點重新上線一次，更新首頁「AI自動化社群更新」的 IG、FB、Threads 貼文
  # （Threads 那排放當天的貼文，Rice 2026-11-08；cron 用 UTC，03:00 UTC = 台灣 11:00；GitHub 排程常晚幾分鐘到半小時）
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 抓 IG 最新貼文；失敗時沿用 repo 裡上一次的資料，不擋上線
      - run: npm run fetch-ig
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      # 抓 FB 粉專貼文（最近的貼文隨機挑 4 篇）；同上，失敗不擋上線；要在 Threads 之前跑
      - run: npm run fetch-fb
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      # 抓 Threads 最新貼文；同上，失敗不擋上線
      - run: npm run fetch-threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      # 使用自訂網域 hbh-tw.store，網站放在網域最上層，不需要子路徑（basePath）
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
